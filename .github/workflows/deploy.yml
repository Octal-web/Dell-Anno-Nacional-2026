name: Build and Deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_DEPLOY_PATH: ${{ secrets.SSH_DEPLOY_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Node Dependencies
        run: npm ci

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Build Assets
        run: npm run build

      - name: Commit build assets to deploy branch
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/repo
          mkdir -p /tmp/repo

          rsync -a --exclude='.git' . /tmp/repo/

          git fetch origin gh-pages || true
          git checkout -B gh-pages origin/gh-pages || git checkout --orphan gh-pages

          rm -rf public/build

          rsync -a /tmp/repo/. .

          git add -A
          git add -f public/build
          git commit -m "chore: deploy build [skip ci]" || echo "Nothing to commit"
          git push origin gh-pages
      - name: Build frontend
        run: npm run build
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Add known hosts
        run: ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy application
        run: |
          rsync -az --delete \
            --include="/public/build/***" \
            --filter=':- .gitignore' \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude=".env" \
            --exclude="public/content/" \
            --exclude="public/files/" \
            --exclude="public/storage" \
            -e "ssh -p $SSH_PORT" \
            ./ \
            "$SSH_USER@$SSH_HOST:$SSH_DEPLOY_PATH/"
      - name: Finish deployment
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            cd '$SSH_DEPLOY_PATH'
          "
